<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Live stream</title>
<link rel="stylesheet" href="./player.css">
<script type="module" src="./player.js"></script>
</head>
<body>
<noscript>Enable JavaScript to load and play streams.</noscript>
<div id="container">
  <section id="setupPanel" hidden aria-labelledby="setupTitle">
    <h1 id="setupTitle">Open a live stream</h1>
    <form id="setupForm">
      <label>Find by
        <select id="lookupKind"><option value="fixture">Fixture name</option><option value="fixture_key">Fixture key</option><option value="id">Match / channel ID</option><option value="url">Stream URL</option></select>
      </label>
      <label class="lookup-value">Name, ID, or HTTPS URL<input id="lookupValue" required autocomplete="off" placeholder="England vs Argentina"></label>
      <label>Stream<input id="streamInput" type="number" min="1" max="100" value="1" required></label>
      <button type="submit">Play stream</button>
    </form>
  </section>
  <div id="toolbar">
    <label class="field source-field"><span>Source</span><select id="sourceSelect" aria-label="Stream source and quality"></select></label>
    <label class="field"><span>Player</span><select id="playerSelect" aria-label="Video player"></select></label>
  </div>
  <div id="playerWrap">
    <video id="video" controls autoplay muted playsinline></video>
    <div id="engineHost"></div>
    <iframe id="framePlayer" title="Embedded live stream" sandbox="allow-scripts allow-presentation" allow="autoplay; fullscreen" referrerpolicy="no-referrer" allowfullscreen></iframe>
    <div id="status" role="status" aria-live="polite">
      <div class="status-inner"><div id="spinner"></div><div id="statusText"></div><button id="retryButton" class="hidden" type="button">Retry</button></div>
    </div>
  </div>
</div>
</body>
</html>
